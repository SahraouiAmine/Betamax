name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        preset: [ci, ci-asan]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pinned versions as tools/*.sh expect locally (see README).
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev
          pipx install clang-format==22.1.8
          pipx install clang-tidy==22.1.8

      - name: Check formatting
        run: tools/format.sh --check

      # Configuring fetches dependencies and writes compile_commands.json,
      # which clang-tidy needs; nothing is compiled.
      - name: Configure
        run: cmake --preset dev

      - name: clang-tidy
        run: tools/tidy.sh build/dev

name: Release

# Pushing a tag like v0.0.1 builds the binaries and publishes a GitHub Release
# with them attached. The Homebrew formula in SahraouiAmine/homebrew-betamax
# points at these archives.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  build:
    name: build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # One universal binary (arm64 + x86_64) covers every Mac. 13.0 is
          # the oldest macOS it promises to run on.
          - name: macos-universal
            os: macos-latest
            # Quoted: an unquoted ; would end the shell command.
            configure: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0'
          # Built on the oldest supported Ubuntu so the binary runs on systems
          # with an older glibc too.
          - name: linux-x86_64
            os: ubuntu-22.04
            configure: -DCMAKE_CXX_COMPILER=g++-12
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the project version
        shell: bash
        run: |
          version=$(sed -n 's/^project(betamax VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version" >&2
            exit 1
          fi

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset release -DBETAMAX_BUILD_TESTS=OFF ${{ matrix.configure }}

      - name: Build
        run: cmake --build --preset release

      - name: Smoke test
        run: build/release/betamax --version

      - name: Package
        shell: bash
        run: |
          archive="betamax-${GITHUB_REF_NAME#v}-${{ matrix.name }}.tar.gz"
          tar -czf "$archive" -C build/release betamax
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum betamax-*.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" betamax-*.tar.gz SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
